[project]
name = "poelis-mcp"
version = "0.0.0"
description = "Self-hostable MCP integration for Poelis (bootstrap)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "mcp==2.3.0",
  "pydantic==2.14.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "editables==0.6",
  "hatchling==1.32.4",
  "mypy==2.4.0",
  "pytest==9.1.1",
]

[tool.uv]
required-version = "==0.13.0"

[tool.hatch.build.targets.wheel]
packages = ["src/poelis_mcp"]

[tool.mypy]
python_version = "3.15"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

# Reject Any types in annotations, expressions, and dependencies.
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_unimported = true
disallow_any_generics = true
disallow_subclassing_any = true

# Require fully typed functions, calls, and decorators.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
check_untyped_defs = true

# Keep import failures visible and require explicit re-exports.
ignore_missing_imports = false
follow_imports = "normal"
implicit_reexport = false

# Preserve strict handling of None, equality, and bytes.
implicit_optional = false
strict_optional = true
strict_equality = true
strict_equality_for_none = true
strict_bytes = true

# Reject unsafe returns, redundant casts, and stale suppressions.
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_no_return = true
extra_checks = true
warn_unused_configs = true
report_deprecated_as_note = false

# Enable optional diagnostics beyond strict mode.
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]

# Keep diagnostics actionable.
show_error_codes = true
show_column_numbers = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = ["error"]
